<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Agent Quota Mini</title>
    <link rel="stylesheet" href="/mini.css?v=20260813-stale-refresh-copy" />
  </head>
  <body>
    <main class="mini-shell" data-mode="panel">
      <header class="mini-header">
        <div class="mini-brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>AIQD</strong>
        </div>
        <div class="mini-actions">
          <button
            id="mini-language-toggle"
            class="tool-button language-tool"
            type="button"
            title="Switch language"
            aria-label="Switch language"
            data-i18n-title-en="Switch language"
            data-i18n-title-zh="切换语言"
            data-i18n-aria-label-en="Switch language"
            data-i18n-aria-label-zh="切换语言"
          >中</button>
          <button
            class="tool-button"
            type="button"
            data-desktop-action="refresh"
            title="Refresh quota data"
            aria-label="Refresh quota data"
            data-i18n-title-en="Refresh quota data"
            data-i18n-title-zh="刷新额度数据"
            data-i18n-aria-label-en="Refresh quota data"
            data-i18n-aria-label-zh="刷新额度数据"
          >
            <span class="icon icon-refresh" aria-hidden="true"></span>
          </button>
          <button
            class="tool-button"
            type="button"
            data-desktop-action="dashboard"
            title="Open dashboard"
            aria-label="Open dashboard"
            data-i18n-title-en="Open dashboard"
            data-i18n-title-zh="打开仪表盘"
            data-i18n-aria-label-en="Open dashboard"
            data-i18n-aria-label-zh="打开仪表盘"
          >
            <span class="icon icon-dashboard" aria-hidden="true"></span>
          </button>
          <button
            class="tool-button"
            type="button"
            data-desktop-action="widget"
            title="Toggle desktop widget"
            aria-label="Toggle desktop widget"
            data-i18n-title-en="Toggle desktop widget"
            data-i18n-title-zh="切换桌面小组件"
            data-i18n-aria-label-en="Toggle desktop widget"
            data-i18n-aria-label-zh="切换桌面小组件"
          >
            <span class="icon icon-pin" aria-hidden="true"></span>
          </button>
          <button
            class="tool-button"
            type="button"
            data-desktop-action="hide"
            title="Hide"
            aria-label="Hide"
            data-i18n-title-en="Hide"
            data-i18n-title-zh="隐藏"
            data-i18n-aria-label-en="Hide"
            data-i18n-aria-label-zh="隐藏"
          >
            <span class="icon icon-close" aria-hidden="true"></span>
          </button>
        </div>
      </header>

      <section id="mini-grid" class="mini-grid" aria-live="polite"></section>
      <footer
        id="mini-footer"
        class="mini-footer"
        data-i18n-en="Refreshing"
        data-i18n-zh="刷新中"
      >Refreshing</footer>
    </main>

    <script src="/mini.js?v=20260815-mini-timing-detail" type="module"></script>
  </body>
</html>
