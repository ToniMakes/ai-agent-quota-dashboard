name: Bug Report
description: Report a reproducible issue with the local dashboard.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please do not paste prompts, responses, source code, credentials, browser cookies, or full raw agent logs.

        For quota/source issues, run `npm run build` and then `node dist/index.js doctor --json`. Review the output before posting. The JSON report is designed to redact local paths and exclude raw source content.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Keep examples sanitized and minimal.
      placeholder: |
        1. Run ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: v0.1.0 or commit SHA
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Doctor JSON report
      description: Paste reviewed output from `node dist/index.js doctor --json` when relevant. Do not paste the plain text Doctor report into public issues because it can include local paths.
      render: json
  - type: textarea
    id: extra-output
    attributes:
      label: Additional sanitized output
      description: Paste only sanitized output. Remove paths, prompts, responses, source code, and account details when unsure.
      render: text
