name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node-version:
          - 24.x

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Generate dependency SBOM
        shell: bash
        run: npm sbom --omit=dev --sbom-format cyclonedx > aiqd-sbom-${{ runner.os }}.json

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aiqd-sbom-${{ runner.os }}
          path: aiqd-sbom-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Run desktop first-run guide smoke
        if: runner.os == 'Windows'
        run: npm run desktop:first-run-smoke
